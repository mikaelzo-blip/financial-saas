name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / tests, dependencies, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fin001_ci_disposable
          POSTGRES_USER: fin001_ci_user
          POSTGRES_PASSWORD: fin001_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      FIN_001_TEST_DATABASE_URL: postgresql+asyncpg://fin001_ci_user:fin001_ci_password@127.0.0.1:5432/fin001_ci_disposable
      FEATURE_012_TEST_DATABASE_URL: postgresql+asyncpg://fin001_ci_user:fin001_ci_password@127.0.0.1:5432/fin001_ci_disposable
      DATABASE_URL: postgresql+asyncpg://fin001_ci_user:fin001_ci_password@127.0.0.1:5432/fin001_ci_disposable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv 0.12.7
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend and test dependencies
        run: |
          uv sync --locked --extra test
          uv pip install --python .venv/bin/python pip==25.3

      - name: Validate installed dependencies
        run: .venv/bin/python -m pip check

      - name: Audit locked production dependencies for known vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/production-requirements.txt"
          uvx pip-audit==2.9.0 --requirement "${RUNNER_TEMP}/production-requirements.txt" --strict --progress-spinner off

      - name: Verify PostgreSQL connectivity and fail-closed prerequisites
        run: |
          .venv/bin/python -c '
          import asyncio, os, sys
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              url = os.environ.get("FIN_001_TEST_DATABASE_URL")
              if not url:
                  print("FATAL: FIN_001_TEST_DATABASE_URL is missing", file=sys.stderr)
                  sys.exit(1)
              engine = create_async_engine(url)
              async with engine.connect() as conn:
                  version = int(await conn.scalar(text("SHOW server_version_num")) or 0)
                  current_db = await conn.scalar(text("SELECT current_database()"))
                  print(f"Connected to PostgreSQL: db={current_db}, server_version_num={version}")
                  if version < 160000:
                      print(f"FATAL: PostgreSQL 16+ required, got {version}", file=sys.stderr)
                      sys.exit(1)
              await engine.dispose()

          asyncio.run(main())
          '

      - name: Run Alembic migrations to current head
        run: .venv/bin/python -m alembic upgrade head

      - name: Verify single Alembic head and current revision
        run: |
          HEADS=$(.venv/bin/python -m alembic heads)
          echo "Alembic heads: $HEADS"
          echo "$HEADS" | grep -q "023_historical_seq_bootstrap (head)" || { echo "FATAL: Unexpected alembic head: $HEADS"; exit 1; }

          CURRENT=$(.venv/bin/python -m alembic current)
          echo "Alembic current: $CURRENT"
          echo "$CURRENT" | grep -q "023_historical_seq_bootstrap (head)" || { echo "FATAL: Unexpected alembic current: $CURRENT"; exit 1; }

      - name: Verify zero Alembic schema drift
        run: .venv/bin/python -m alembic check

      - name: Run required FIN-001 PostgreSQL concurrency and retry test group
        run: |
          .venv/bin/python -m pytest -q -p no:cacheprovider \
            tests/integration/test_fin001_ar_ap_concurrency_postgresql.py \
            tests/integration/test_fin001_cp3_retry_postgresql.py \
            tests/unit/test_fin001_cp3_retry_classification.py

      - name: Run full backend test suite
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

      - name: Validate complete Alembic migration chain offline
        run: |
          .venv/bin/python -m alembic upgrade head --sql > "${RUNNER_TEMP}/financial-saas-migrations.sql"
          test -s "${RUNNER_TEMP}/financial-saas-migrations.sql"

  frontend:
    name: Frontend / tests, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Audit production dependencies for high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

  repository-safety:
    name: Repository / tracked secrets and environment files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository with full tracked content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify repository safety
        run: bash .github/scripts/check-repository-safety.sh
