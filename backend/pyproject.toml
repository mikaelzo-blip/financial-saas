[project]
name = "financial-saas-backend"
version = "0.1.0"
description = "Financial SaaS Backend - Single-Input Project-Based Accounting Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.12",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt[crypto]>=2.9.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.0.0",
    "pypdf>=6.16.2",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.29.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<1",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
]
test = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<1",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<1",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
